aid: rimsys
name: Rimsys
description: 'Rimsys is a Regulatory Information Management (RIM) platform purpose-built for medical
  device and MedTech manufacturers. It centralizes regulatory submissions, global product registrations,
  Unique Device Identification (UDI) management, standards and GSPR maintenance, regulatory intelligence,
  impact assessments, and market-access operations in a single system of record. Rimsys exposes
  enterprise APIs and an event-driven change-data-capture layer (Rimsys Connect) to integrate
  regulatory data with PLM, ERP, QMS, CRM, and BI tools, and provides direct EUDAMED/GUDID UDI
  transmission. Developer documentation is published at docs.rimsys.io.'
